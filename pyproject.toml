[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bump-my-version-gh-safe-release"
version = "0.1.0"
description = "Release only what passed the GitHub CI: a thin layer over bump-my-version."
readme = "README.md"
license = "LGPL-3.0-or-later"
authors = [{ name = "Edvard Rejthar", email = "edvard.rejthar@nic.cz" }]
requires-python = ">=3.10"
dependencies = ["bump-my-version>=1.3"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Software Development :: Version Control :: Git"]

[project.urls]
Homepage = "https://github.com/CZ-NIC/bump-my-version-gh-safe-release"

[tool.hatch.build.targets.wheel]
packages = ["gh_safe_release"]

[project.scripts]
gh-safe-release = "gh_safe_release:main"

[dependency-groups]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
filterwarnings = ["error"]

# The tool releases itself: write the changes under the "## Unreleased" CHANGELOG.md heading, then `gh-safe-release patch`.
[tool.bumpversion]
current_version = "0.1.0"
tag_name = "{new_version}"
tag_message = "{new_version}"
message = "chore(release): {new_version}"

# CHANGELOG first, so that a missing heading fails before anything is written.
[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## Unreleased"
replace = "## {new_version} ({now:%Y-%m-%d})"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = '^version = "{current_version}"'
replace = 'version = "{new_version}"'
regex = true
