name: tests
on:
  push:
    branches: ['**']  # tags run the suite through publish.yml, which waits for it
  workflow_call:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install --upgrade "pip>=25.1" && pip install -e . --group test
      - run: pytest
