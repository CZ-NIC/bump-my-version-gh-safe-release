name: publish
on:
  push:
    tags:
      - '[0-9]+\.[0-9]+\.[0-9]+'
      - '[0-9]+\.[0-9]+\.[0-9]+-?rc\.?[0-9]+'

jobs:
  # Publish only what passes the suite on the very tagged commit.
  tests:
    uses: ./.github/workflows/tests.yml
  pypi:
    needs: tests
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write  # create the GitHub release
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the version
        run: grep -q "^version = \"$GITHUB_REF_NAME\"" pyproject.toml || { echo "::error::tag $GITHUB_REF_NAME differs from the version in pyproject.toml"; exit 1; }
      - name: Build the package
        run: python3 -m pip install --upgrade build && python3 -m build
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
      # GitHub release (so that "Watch → Releases" notifies), notes taken from the CHANGELOG.md section of the tag
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="$TAG" '/^## /{found = ($2 == tag); next} found' CHANGELOG.md > notes.md
          flags=()
          [[ "$TAG" == *rc* ]] && flags+=(--prerelease)
          if grep -q "[^[:space:]]" notes.md; then flags+=(--notes-file notes.md); else flags+=(--generate-notes); fi
          gh release create "$TAG" dist/* --title "$TAG" --verify-tag "${flags[@]}"
